spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

logging:
  level:
    com.company.emailpdf: DEBUG
    org.hibernate.SQL: DEBUG

app:
  pdf:
    output-directory: /tmp/test-pdfs
  processing:
    max-concurrent-jobs: 2
    default-date-range-days: 30
    default-max-emails: 100
  scheduling:
    enabled: false
